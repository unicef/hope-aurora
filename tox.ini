[tox]
requires =
    tox>=4.2
    tox-gh-actions
    tox-uv>=1.20.2
env_list =
    lint
    d{52}-py{312}
    pkg_meta

[testenv]
pass_env =
    CACHE_DEFAULT
    DATABASE_URL
set_env =
    PYTHONDONTWRITEBYTECODE = 1
    SECRET_KEY = super-secret-key-just-for-testing
commands =
    {posargs:pytest tests -rw --create-db --cov-report=xml --junit-xml=junit.xml -o junit_family=legacy -vv --headless}
dependency_groups = dev

[testenv:lint]
description = run static analysis and style check using ruff
skip_install = true
deps =
    pre-commit-uv>=4.1.1
commands =
    pre-commit run --all-files --show-diff-on-failure

[testenv:pkg_meta]
description = check that the long description is valid
skip_install = true
deps =
    check-wheel-contents>=0.6
    twine>=5.1.1
    uv>=0.5
commands =
    uv build -q --sdist --wheel --out-dir {env_tmp_dir} .
    twine check {env_tmp_dir}{/}*
    check-wheel-contents --ignore W002,W004,W009,W004 {env_tmp_dir}

[testenv:mypy]
description = check that the long description is valid
skip_install = false
deps =
set_env =
    SECRET_KEY = super-secret-key-just-for-testing
commands =
    mypy --install-types {posargs:src}
dependency_groups = mypy
