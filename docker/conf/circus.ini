[circus]
statsd = 1
check_delay = 5

[watcher:nginx]
cmd = /sbin/nginx
args = -c /conf/nginx.conf
numprocesses = 1
use_sockets = False
copy_env = True
autostart = $(CIRCUS.ENV.START_PROXY)
stop_signal = QUIT
respawn = True
uid = root
gid = root
send_hup = true

[watcher:uwsgi]
cmd = /usr/local/bin/uwsgi
args = --ini /conf/uwsgi.ini
numprocesses = 1
use_sockets = True
virtualenv=/venv/
copy_env = True
autostart = $(CIRCUS.ENV.START_APP)
stop_signal = QUIT
kill_signal = TERM


[watcher:worker]
cmd = /venv/bin/django-admin
args = rundramatiq
numprocesses = 1
use_sockets = False
virtualenv=/venv/
copy_env = True
autostart = $(CIRCUS.ENV.START_WORKER)
stop_signal = QUIT
kill_signal = KILL

[watcher:beat]
cmd = /venv/bin/django-admin
args = crontab
numprocesses = 1
use_sockets = False
virtualenv=/venv/
copy_env = True
autostart = $(CIRCUS.ENV.START_CRON)
stop_signal = QUIT
kill_signal = KILL

[watcher:celery]
cmd = /venv/bin/celery
args = -A aurora worker --loglevel=info
numprocesses = 1
use_sockets = False
virtualenv=/venv/
copy_env = True
autostart = $(CIRCUS.ENV.START_CELERY_WORKER)
stop_signal = TERM
kill_signal = KILL
