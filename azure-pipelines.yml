          #     docker pull $(Docker.registry).azurecr.io/$(Docker.repository):latest
          #     docker tag $(Docker.registry).azurecr.io/$(Docker.repository):latest unicef/hope-aurora:acr-2.0
          #   displayName: Pull from ACR and tag
          # - script: |
          #     echo "$(DOCKERHUB_TOKEN)" | docker login -u "$(DOCKERHUB_USERNAME)" --password-stdin
