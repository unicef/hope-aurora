# Manual only: pull latest from ACR (flex master) and push to Docker Hub as unicef/hope-aurora:acr-2.0
# Use with branch feat/image-to-dh. Set variables: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (secret)
trigger: none
pr: none
resources:
  - repo: self

variables:
  - group: flex-registration-prod
  - name: Docker.registry
    value: "unihopeukrsr"
  - name: Docker.repository
    value: "flex-registration"
  - name: azureSubscription
    value: "UNI_WEBS rs-uni-hope-ukr-sr"
  - name: appName
    value: "uni-hope-ukr-sr"

stages:
  - stage: push_to_dockerhub
    displayName: Push to Docker Hub (acr-2.0)
    jobs:
      - job: mirror_to_dockerhub
        pool:
          vmImage: ubuntu-latest
        displayName: "Pull from ACR, tag and push to Docker Hub"
        steps:
          - task: Docker@2
            displayName: Login to ACR
            inputs:
              containerRegistry: '$(Docker.registry)'
              command: 'login'
          - script: |
              docker pull $(Docker.registry).azurecr.io/$(Docker.repository):latest
              docker tag $(Docker.registry).azurecr.io/$(Docker.repository):latest unicef/hope-aurora:acr-2.0
            displayName: Pull from ACR and tag for Docker Hub
          - script: |
              echo "$(DOCKERHUB_TOKEN)" | docker login -u "$(DOCKERHUB_USERNAME)" --password-stdin
              docker push unicef/hope-aurora:acr-2.0
            displayName: Login to Docker Hub and push
