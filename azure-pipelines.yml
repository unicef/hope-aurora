# Manual only: pull latest from ACR (flex master) and push to Docker Hub as unicef/hope-aurora:acr-2.0
# Use with branch feat/image-to-dh. Set variables: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (secret)
trigger: none
pr: none
resources:
  - repo: self

variables:
  - group: flex-registration-prod
  - name: Docker.registry
    value: "unihopeukrsr"
  - name: Docker.repository
    value: "flex-registration"
  - name: azureSubscription
    value: "UNI_WEBS rs-uni-hope-ukr-sr"
  - name: appName
    value: "uni-hope-ukr-sr"

stages:
  - stage: discovery
    displayName: ACR Discovery (list tags, Web App image)
    jobs:
      - job: mirror_to_dockerhub
        pool:
          vmImage: ubuntu-latest
        displayName: "List ACR tags and Web App container"
        steps:
          - task: AzureCLI@2
            displayName: List all images in production ACR
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "=== ACR repositories in $(Docker.registry) ==="
                az acr repository list --name $(Docker.registry) -o table
                echo ""
                echo "=== Tags for flex-registration ==="
                az acr repository show-tags --name $(Docker.registry) --repository flex-registration -o table 2>/dev/null || echo "(repository not found or no tags)"
                echo ""
                echo "=== Tags for all repositories ==="
                for repo in $(az acr repository list --name $(Docker.registry) -o tsv); do
                  echo "--- $repo ---"
                  az acr repository show-tags --name $(Docker.registry) --repository $repo -o table 2>/dev/null | head -20
                done
          - task: AzureCLI@2
            displayName: Web App container image (production)
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "=== Finding Web App and its container config ==="
                # List webapps to find resource group
                az webapp list --query "[?name=='$(appName)'].{name:name, resourceGroup:resourceGroup}" -o table
                # Get container config (resource group may vary - try common patterns)
                for rg in $(az webapp list --query "[?name=='$(appName)'].resourceGroup" -o tsv); do
                  echo ""
                  echo "=== Container config for $(appName) (rg: $rg) ==="
                  az webapp config container show --name $(appName) --resource-group $rg -o table 2>/dev/null || az webapp config show --name $(appName) --resource-group $rg --query "linuxFxVersion" -o tsv 2>/dev/null
                done
          # Pull, tag, push - uncomment when ready
          # - task: Docker@2
          #   displayName: Login to ACR
          #   inputs:
          #     containerRegistry: '$(Docker.registry)'
          #     command: 'login'
