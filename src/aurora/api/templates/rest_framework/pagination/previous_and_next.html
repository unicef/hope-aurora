<ul class="pager">
    {% if previous_url %}
        <li class="previous">
            <a href="{{ previous_url }}">« Previous</a>
        </li>
    {% else %}
        <li class="previous disabled">
            <a href="#">« Previous</a>
        </li>
    {% endif %}
    {% if next_url %}
        <li class="next">
            <a href="{{ next_url }}">Next »</a>
        </li>
    {% else %}
        <li class="next disabled">
            <a href="#">Next »</a>
        </li>
    {% endif %}
</ul>
